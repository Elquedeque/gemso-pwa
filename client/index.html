<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GEMSO</title>
    <meta name="description" content="Avisos, documentos y perfil de los colaboradores de GEMSO Autos de Hermosillo." />

    <!-- Íconos (generados desde src/assets/icon_GEMSO.png) -->
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Color de la barra del navegador / barra de estado al instalar la app -->
    <meta name="theme-color" content="#000080" />

    <!-- iPhone: abrir como app (sin barra de Safari) al agregarla a la pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GEMSO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Aplica el modo oscuro antes de pintar la página (evita un destello blanco).
         Usa la misma clave que client/src/utils/tema.js -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
